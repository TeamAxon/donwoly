services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: donwoly
      POSTGRES_USER: donwoly
      POSTGRES_PASSWORD: donwoly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donwoly -d donwoly"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # Container-to-container addresses must use Compose service names, not localhost.
      DATABASE_URL: postgresql+psycopg://donwoly:donwoly@postgres:5432/donwoly
      QDRANT_URL: http://qdrant:6333
      # Local development fallback only. Set JWT_SECRET in production.
      JWT_SECRET: ${JWT_SECRET:-donwoly-local-development-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
volumes:
  qdrant_data:
  postgres_data:
